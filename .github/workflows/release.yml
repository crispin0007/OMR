# Builds the downloads for Windows, macOS and Linux. Pushing a version tag (v0.2.0, matching pyproject.toml)
# publishes them as a GitHub Release with checksums; running it by hand (Actions > Release > Run workflow)
# only builds them, as workflow artifacts to try before tagging.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inno Setup 6.3 or newer
        run: choco upgrade innosetup -y --no-progress
      - name: Build the installer and the portable zip
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/OMR-Setup-*.exe
            dist/OMR-Portable-*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon, then Intel
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[app]" pyinstaller
          pyinstaller --noconfirm --distpath dist --workpath build packaging/omr.spec
      - name: Make the .dmg
        run: packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu, so the app runs on newer distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[app]" pyinstaller
          pyinstaller --noconfirm --distpath dist --workpath build packaging/omr.spec
      - name: Make the .deb, AppImage and .tar.gz
        run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --title "OMR Checker ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes-file ../packaging/release-notes.md
