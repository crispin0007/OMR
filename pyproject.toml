[project]
name = "omr"
version = "0.1.0"
description = "Offline OMR checking for schools, colleges and exam bodies"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pypdfium2>=4.30",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "uharfbuzz>=0.39",  # joins Hindi letters in printed PDFs; Apache-2.0, HarfBuzz is MIT
    "zxing-cpp>=2.2",
    "cryptography>=42",  # the certificate for phones' secure link; Apache-2.0 or BSD
]

[project.optional-dependencies]
app = [
    "PySide6>=6.7",
    "keyring>=24",  # passwords and API keys for sending results, in the system credential store
    "pywin32>=306; sys_platform == 'win32'",
]
dev = ["pytest>=8"]

[project.scripts]
omr = "omr_app.__main__:main"
omr-read = "omr_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omr_core", "src/omr_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
